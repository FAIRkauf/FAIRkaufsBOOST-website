<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pilot-Kontingent · Fairkaufsboost</title>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f6f5f0;color:#2c3736;
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}
  .card{background:#fff;border:1px solid #ded9cf;border-radius:16px;padding:40px 36px;max-width:420px;width:100%;text-align:center;
    box-shadow:0 20px 50px -30px rgba(44,55,54,.35)}
  h1{font-size:1.1rem;margin:0 0 6px;color:#4b5b5a}
  .n{font-size:4rem;font-weight:800;margin:14px 0 4px;color:#2c3736;line-height:1}
  .goal{color:#6a7a78;font-size:.95rem;margin-bottom:22px}
  .bar{height:10px;border-radius:999px;background:#e7efed;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:#ffd23f;width:0%;transition:width .5s ease}
  .status{font-size:.85rem;color:#6a7a78}
  .refresh{margin-top:22px;display:inline-block;font-size:.8rem;color:#4b5b5a;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
  .err{color:#c81e29;font-size:.85rem;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Pilot-Kontingent · Wochenende 04.–06.09.</h1>
  <div class="n" id="count">–</div>
  <div class="goal">von 100 Boost-Anfragen eingegangen</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="status" id="status">Lädt …</div>
  <div class="err" id="err">Zähler gerade nicht erreichbar. In ein paar Sekunden nochmal versuchen.</div>
  <button class="refresh" id="refresh">Aktualisieren</button>
</div>
<script>
const NS = 'fairkaufsboost-de';
const KEY = 'pilot-wochenende-2026-09';
const GOAL = 100;

async function load(){
  document.getElementById('err').style.display = 'none';
  document.getElementById('status').textContent = 'Lädt …';
  try {
    const res = await fetch(`https://abacus.jasoncameron.dev/get/${NS}/${KEY}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    const n = typeof data.value === 'number' ? data.value : 0;
    document.getElementById('count').textContent = n;
    document.getElementById('bar').style.width = Math.min(100, n / GOAL * 100) + '%';
    document.getElementById('status').textContent = n >= GOAL
      ? 'Kontingent für dieses Wochenende voll.'
      : `Noch ${Math.max(GOAL - n, 0)} Plätze frei.`;
  } catch (e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('status').textContent = '';
  }
}
document.getElementById('refresh').addEventListener('click', load);
load();
setInterval(load, 20000);
</script>
</body>
</html>
